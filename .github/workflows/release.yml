name: Release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR tags the
# release (vX.Y.Z) and publishes a GitHub Release. The multi-arch image build +
# push to GHCR is a separate workflow (publish.yml) triggered by that release
# event, so it also fires for releases cut outside release-please.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags & releases
      pull-requests: write    # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp
        with:
          # "simple" tracks version.txt + CHANGELOG.md, language-agnostic.
          release-type: simple

  # Building the image has to hang off this job rather than off the release
  # event: the release release-please publishes carries GITHUB_TOKEN, and
  # GitHub does not start workflows from GITHUB_TOKEN events. Called in the
  # same run, it just works — no PAT to mint, rotate, or leak.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
