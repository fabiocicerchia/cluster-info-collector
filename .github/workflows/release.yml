name: Release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR tags the
# release (vX.Y.Z) and publishes a GitHub Release. The multi-arch image build +
# push to GHCR is a separate workflow (publish.yml) triggered by that release
# event, so it also fires for releases cut outside release-please.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags & releases
      pull-requests: write    # open/update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # "simple" tracks version.txt + CHANGELOG.md, language-agnostic.
          release-type: simple
