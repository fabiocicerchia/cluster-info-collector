# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cluster-info-collector
  description: >-
      One-shot Kubernetes cluster snapshot collector — dumps nodes, workloads, events, and logs into a
      single tarball for offline debugging or support tickets.
  annotations:
    github.com/project-slug: fabiocicerchia/cluster-info-collector
    backstage.io/source-location: url:https://github.com/fabiocicerchia/cluster-info-collector/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/cluster-info-collector
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
